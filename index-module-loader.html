<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZyWeb - Modular Version</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module">
      // 导入模块加载器
      import { app, loadModule, preloadModules, loadSharedComponent, loadSharedUtils } from '/src/renderer/src/main-module-loader.ts';
      
      // 将加载函数挂载到全局对象上，以便在应用中使用
      window.loadModule = loadModule;
      window.preloadModules = preloadModules;
      window.loadSharedComponent = loadSharedComponent;
      window.loadSharedUtils = loadSharedUtils;
      
      // 隐藏加载界面
      window.removeLoading = () => {
        const loadingElement = document.getElementById('loading');
        if (loadingElement) {
          loadingElement.style.display = 'none';
        }
      };
      
      // 预加载常用模块
      preloadModules(['film', 'iptv']).then(() => {
        console.log('常用模块预加载完成');
      }).catch((error) => {
        console.error('模块预加载失败:', error);
      });
      
      // 预加载共享组件和工具函数
      Promise.all([
        loadSharedComponent('button'),
        loadSharedComponent('card'),
        loadSharedUtils()
      ]).then(() => {
        console.log('共享组件和工具函数预加载完成');
      }).catch((error) => {
        console.error('共享组件和工具函数预加载失败:', error);
      });
    </script>
  </body>
</html>
